plugins { id 'com.android.application' }
android {
    namespace 'ru.fridgedays.app'
    compileSdk 35
    defaultConfig {
        applicationId 'ru.fridgedays.app'
        minSdk 31
        targetSdk 35
        versionCode 4
        versionName '0.3.0'
        testInstrumentationRunner project.findProperty('fridge.testRunner') ?: 'ru.fridgedays.app.SmokeInstrumentation'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation project(':core')
    implementation 'com.google.zxing:core:3.5.3'
    implementation files('libs/tesseract4android-4.9.0-standard.aar')
    // Pinned to the upstream Java-only annotation dependency; no Kotlin runtime needed.
    //noinspection GradleDependency
    compileOnly 'androidx.annotation:annotation:1.3.0'
}
