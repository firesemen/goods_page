plugins { id 'com.android.application' }
android {
    namespace 'ru.fridgedays.app'
    compileSdk 35
    defaultConfig {
        applicationId 'ru.fridgedays.app'
        minSdk 31
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
        testInstrumentationRunner project.findProperty('fridge.testRunner') ?: 'ru.fridgedays.app.SmokeInstrumentation'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation project(':core')
    implementation 'com.google.zxing:core:3.5.3'
}
